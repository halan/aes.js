[package]
name = "aes-rs"
version = "0.1.0"
edition = "2021"
description = "Didactic AES-128 implementation in Rust — companion to ../src (TypeScript)."
license = "ISC"
publish = false

[lib]
# `cdylib` é necessário para gerar o `.wasm`; `rlib` mantém o uso normal
# como crate Rust (testes, dependentes locais, etc.).
crate-type = ["cdylib", "rlib"]

[features]
# Por padrão a crate é Rust puro, sem deps. A feature `wasm` ativa as
# bindings via `wasm-bindgen` para consumo a partir do TS/JS.
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "aes"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Constantes hexadecimais com 0x.. são mais legíveis em maiúscula para AES.
unreadable_literal = "allow"
# Tabelas de 256 entradas literais são intencionais (didáticas).
too_many_lines = "allow"
